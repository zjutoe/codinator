[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codinator"
version = "0.1.0"
description = "Codex task interface with durable background implementation and review"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codinator = "codinator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codinator = ["templates/*.md"]
