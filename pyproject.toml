[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codidator"
version = "0.1.0"
description = "Durable Pi implementation and Codex review loops"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codidator = "codidator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
